name: Build and Push GPU Docker Image

permissions:
  contents: read
  packages: write

on:
  release:
    types: [published]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build type: "dev" or a version tag e.g. "v0.16.0"'
        required: true
        default: 'dev'

jobs:
  build-gpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-type: ${{ github.event_name == 'schedule' && fromJson('["dev"]') || github.event_name == 'workflow_dispatch' && fromJson(format('["{0}"]', inputs.build-type)) || fromJson(format('["{0}"]', github.ref_name)) }}
        cuda-arch:
          - 75   # Turing  — T4 (AWS g4dn, GCP T4)
          - 80   # Ampere  — A100 (AWS p4d, GCP A100)
          - 90   # Hopper  — H100 (AWS p5, GCP H100)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set GITHUB_TOKEN
        run: echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Log in to GHCR
        run: make login

      - name: Set TAG, VERSION and CUDA_ARCH
        run: |
          if [ "${{ matrix.build-type }}" = "dev" ]; then
            echo "TAG=dev" >> $GITHUB_ENV
          else
            echo "TAG=${{ matrix.build-type }}" >> $GITHUB_ENV
            echo "VERSION=${{ matrix.build-type }}" >> $GITHUB_ENV
          fi
          echo "CUDA_ARCH=${{ matrix.cuda-arch }}" >> $GITHUB_ENV

      - name: Build and push GPU Docker image
        run: make all-gpu

      - name: Tag and push latest-gpu (release builds only)
        if: github.event_name == 'release'
        run: |
          docker tag ${FULL_IMAGE}:${TAG}-gpu-sm${CUDA_ARCH} ${FULL_IMAGE}:latest-gpu-sm${CUDA_ARCH}
          docker push ${FULL_IMAGE}:latest-gpu-sm${CUDA_ARCH}
        env:
          FULL_IMAGE: ghcr.io/benvial/palace
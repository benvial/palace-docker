name: Build and Push CPU Docker Image

permissions:
  contents: read
  packages: write

on:
  release:
    types: [published]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build type: "dev" or a version tag e.g. "v0.16.0"'
        required: true
        default: 'dev'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-type: ${{ github.event_name == 'schedule' && fromJson('["dev"]') || github.event_name == 'workflow_dispatch' && fromJson(format('["{0}"]', inputs.build-type)) || fromJson(format('["{0}"]', github.ref_name)) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set GITHUB_TOKEN
        run: echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Log in to GHCR
        run: make login

      - name: Set TAG and VERSION
        run: |
          if [ "${{ matrix.build-type }}" = "dev" ]; then
            echo "TAG=dev" >> $GITHUB_ENV
          else
            echo "TAG=${{ matrix.build-type }}" >> $GITHUB_ENV
            echo "VERSION=${{ matrix.build-type }}" >> $GITHUB_ENV
          fi

      - name: Build and push Docker image
        run: make all

      - name: Tag and push latest (release builds only)
        if: github.event_name == 'release'
        run: |
          docker tag ${FULL_IMAGE}:${TAG} ${FULL_IMAGE}:latest
          docker push ${FULL_IMAGE}:latest
        env:
          FULL_IMAGE: ghcr.io/benvial/palace
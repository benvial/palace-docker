name: Build and Push Docker Images

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-type:
          - dev
          - v0.16.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set GITHUB_TOKEN
        run: echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Log in to GHCR
        run: make login

      - name: Set TAG and VERSION
        run: |
          if [ "${{ matrix.build-type }}" = "dev" ]; then
            echo "TAG=dev" >> $GITHUB_ENV
          else
            echo "TAG=latest" >> $GITHUB_ENV
            echo "VERSION=${{ matrix.build-type }}" >> $GITHUB_ENV
          fi

      - name: Build and push Docker image
        run: make all

  build-gpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-type:
          - dev
          - v0.16.0
        cuda-arch:
          - 75   # Turing  — T4 (AWS g4dn, GCP T4)
          - 80   # Ampere  — A100 (AWS p4d, GCP A100)
          - 90   # Hopper  — H100 (AWS p5, GCP H100)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set GITHUB_TOKEN
        run: echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Log in to GHCR
        run: make login

      - name: Set TAG, VERSION and CUDA_ARCH
        run: |
          if [ "${{ matrix.build-type }}" = "dev" ]; then
            echo "TAG=dev" >> $GITHUB_ENV
          else
            echo "TAG=latest" >> $GITHUB_ENV
            echo "VERSION=${{ matrix.build-type }}" >> $GITHUB_ENV
          fi
          echo "CUDA_ARCH=${{ matrix.cuda-arch }}" >> $GITHUB_ENV

      - name: Build and push GPU Docker image
        run: make all-gpu